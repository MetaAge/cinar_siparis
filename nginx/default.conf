server {
    server_name api.cinarpastaneleri.com;

    root /var/www/cinar_siparis/backend/public;
    index index.php;

    client_max_body_size 50M;

    # =====================
    # API + UPLOAD CORS
    # =====================
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://siparis.cinarpastaneleri.com";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "https://siparis.cinarpastaneleri.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # =====================
    # STORAGE (IMAGE) CORS
    # =====================
    location /storage/ {
        add_header Access-Control-Allow-Origin "https://siparis.cinarpastaneleri.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.cinarpastaneleri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cinarpastaneleri.com/privkey.pem;
}